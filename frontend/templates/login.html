
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EPlanet Soft</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/logo.png">
    <script src="/static/common.js"></script>
    <style>
        /* Page-specific styles for login.html */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 2.5rem;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .nav-brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .theme-toggle-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 0.6rem 1.1rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
        }

        .theme-toggle-pill:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .nav-auth-btn {
            border-radius: 999px;
            padding: 0.6rem 1.4rem;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .nav-auth-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: transparent;
            box-shadow: 0 6px 18px rgba(30, 58, 95, 0.25);
        }

        .nav-auth-btn:hover {
            transform: translateY(-1px);
        }

        .auth-page-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-container {
            background: var(--bg-primary);
            max-width: 400px;
            box-shadow: var(--shadow-2xl);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            background: #ffffff;
            color: #1e293b;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1);
        }

        .error, .success {
            font-size: 0.9rem;
            margin-top: 0.5rem;
            padding: 0.5rem;
            border-radius: 4px;
        }

        .error {
            color: var(--danger-color);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success {
            color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .spinner {
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .logo-tagline {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .welcome-text {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 0;
            margin-bottom: 0.25rem;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body data-theme="light">
    <nav class="top-nav">
        <div class="nav-logo">
            <img src="/static/logo.png" alt="EPlanet Soft logo">
            <span class="nav-brand-text">EPlanet Soft</span>
        </div>
        <div class="nav-actions">
            <button id="themeToggle" class="theme-toggle-pill" type="button">
                <i class="fas fa-moon"></i> Dark Mode
            </button>
            <button id="navLoginBtn" class="nav-auth-btn active" type="button">Login</button>
            <button id="navRegisterBtn" class="nav-auth-btn" type="button">Register</button>
        </div>
    </nav>

    <div class="auth-page-wrap">
    <div class="auth-container">
        <div class="logo-tagline" style="text-align: center; margin-bottom: 1.25rem;">Advanced AI-powered voice calling platform for Assistance</div>

        <div class="auth-header">
            <h2 class="welcome-text" id="welcomeText">Welcome Back</h2>
            <p class="auth-subtitle" id="authTitle">Sign in to manage your campaigns</p>
        </div>

        <form id="authForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group" id="emailGroup" style="display: none;">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group" id="roleGroup" style="display: none;">
                <label for="role">Role</label>
                <select id="role" name="role">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="auth-btn" id="authButton" style="background: var(--primary-color); color: white; border: none; padding: 0.75rem; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 1rem;">Login</button>
            
            <div id="message" style="display: none;"></div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                Processing...
            </div>
        </form>

        <div class="auth-switch">
            <span id="switchText">Don't have an account?</span>
            <a href="#" id="switchLink">Sign up</a>
        </div>

        <div class="user-types">
            <h3>Demo Accounts:</h3>
            <div class="user-type">
                <strong>Admin:</strong> admin / admin123
            </div>
            <div class="user-type">
                <strong>User:</strong> user / user123
            </div>
        </div>
    </div>
    </div>

    <script>
        let isLoginMode = true;

        const navLoginBtn = document.getElementById('navLoginBtn');
        const navRegisterBtn = document.getElementById('navRegisterBtn');
        const authForm = document.getElementById('authForm');
        const authTitle = document.getElementById('authTitle');
        const authButton = document.getElementById('authButton');
        const switchText = document.getElementById('switchText');
        const switchLink = document.getElementById('switchLink');
        const emailGroup = document.getElementById('emailGroup');
        const roleGroup = document.getElementById('roleGroup');
        const messageDiv = document.getElementById('message');
        const loadingDiv = document.getElementById('loading');

        const welcomeText = document.getElementById('welcomeText');

        // Switch between login and signup
        function setMode(loginMode) {
            isLoginMode = loginMode;

            if (isLoginMode) {
                welcomeText.textContent = 'Welcome Back';
                authTitle.textContent = 'Sign in to manage your campaigns';
                authButton.textContent = 'Login';
                switchText.textContent = "Don't have an account?";
                switchLink.textContent = 'Sign up';
                emailGroup.style.display = 'none';
                roleGroup.style.display = 'none';
                document.getElementById('email').required = false;
            } else {
                welcomeText.textContent = 'Get Started';
                authTitle.textContent = 'Create your account to begin';
                authButton.textContent = 'Sign Up';
                switchText.textContent = 'Already have an account?';
                switchLink.textContent = 'Login';
                emailGroup.style.display = 'block';
                roleGroup.style.display = 'block';
                document.getElementById('email').required = true;
            }

            navLoginBtn.classList.toggle('active', isLoginMode);
            navRegisterBtn.classList.toggle('active', !isLoginMode);

            // Clear any messages
            showMessage('', '');
        }

        switchLink.addEventListener('click', function(e) {
            e.preventDefault();
            setMode(!isLoginMode);
        });

        navLoginBtn.addEventListener('click', function() {
            setMode(true);
        });

        navRegisterBtn.addEventListener('click', function() {
            setMode(false);
        });

        function showMessage(message, type) {
            if (message) {
                messageDiv.textContent = message;
                messageDiv.className = type;
                messageDiv.style.display = 'block';
            } else {
                messageDiv.style.display = 'none';
            }
        }

        function showLoading(show) {
            loadingDiv.style.display = show ? 'block' : 'none';
            authButton.disabled = show;
        }

        authForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;
            
            showLoading(true);
            showMessage('', '');
            
            try {
                const endpoint = isLoginMode ? '/api/login' : '/api/signup';
                const payload = isLoginMode 
                    ? { username, password }
                    : { username, password, email, role };

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': isLoginMode ? 'application/x-www-form-urlencoded' : 'application/json'
                    },
                    body: isLoginMode 
                        ? new URLSearchParams(payload)
                        : JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    
                    if (isLoginMode) {
                        // Redirect to dashboard after successful login
                        setTimeout(() => {
                            window.location.href = data.redirect_url || '/';
                        }, 1000);
                    } else {
                        // Redirect to dashboard after successful signup
                        setTimeout(() => {
                            window.location.href = data.redirect_url || '/';
                        }, 1000);
                    }
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Connection error. Please try again.', 'error');
            } finally {
                showLoading(false);
            }
        });
    </script>
</body>
</html>
